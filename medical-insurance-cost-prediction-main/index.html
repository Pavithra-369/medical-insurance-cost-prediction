<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Cost Prediction</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#eaf4fc;
}

.container{
    width:450px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0066cc;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Insurance Cost Prediction</h1>

<form action="/predict" method="post">

<label>Age</label>
<input type="number" name="age" required>

<label>Sex</label>
<select name="sex">
    <option value="0">Female</option>
    <option value="1">Male</option>
</select>

<label>BMI</label>
<input type="number" step="0.01" name="bmi" required>

<label>Children</label>
<input type="number" name="children" required>

<label>Smoker</label>
<select name="smoker">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Region</label>
<select name="region">
    <option value="0">Northeast</option>
    <option value="1">Northwest</option>
    <option value="2">Southeast</option>
    <option value="3">Southwest</option>
</select>

<button type="submit">Predict Insurance Cost</button>

</form>

{% if prediction %}

<div class="result">
Predicted Insurance Cost<br><br>

₹ {{ prediction }}

</div>

{% endif %}

</div>

</body>
</html>
